<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="todo-app">
        <h2>To-Do List 📋✍️</h2>
        <div class="row">
            <input type="text" id="input-box" placeholder="Add your text">
            <button onclick="addTask()">Add</button>
        </div>
        <ul id="list-container">
            <!-- Dữ liệu công việc sẽ hiển thị ở đây -->
        </ul>
    </div>
</div>

<script>
    const inputBox = document.getElementById("input-box");
    const listContainer = document.getElementById("list-container");

    function addTask() {
        if(inputBox.value.trim() === ''){
            alert("Vui lòng nhập nội dung công việc!");
        } else {
            let li = document.createElement("li");
            li.innerHTML = inputBox.value;
            listContainer.appendChild(li);
            
            let span = document.createElement("span");
            span.innerHTML = "\u00d7"; // Dấu nhân (x)
            li.appendChild(span);
        }
        inputBox.value = "";
        saveData();
    }

    // Bấm phím Enter để thêm công việc nhanh
    inputBox.addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            addTask();
        }
    });

    // Lắng nghe sự kiện click vào danh sách (để check hoàn thành hoặc xóa)
    listContainer.addEventListener("click", function(e) {
        if(e.target.tagName === "LI"){
            e.target.classList.toggle("checked");
            saveData();
        } else if(e.target.tagName === "SPAN"){
            e.target.parentElement.remove();
            saveData();
        }
    }, false);

    // Lưu dữ liệu vào trình duyệt (localStorage) để không bị mất khi F5
    function saveData() {
        localStorage.setItem("data", listContainer.innerHTML);
    }

    function showTask() {
        listContainer.innerHTML = localStorage.getItem("data");
    }
    showTask();
</script>

</body>
</html>
